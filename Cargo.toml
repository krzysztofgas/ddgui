[package]
name = "ddgui"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.11"
libc = "0.2.191"
liblzma = { version = "0.4.9", features = ["parallel"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
plist = "1.10.3"
zstd = { version = "0.14.4", features = ["zstdmt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
